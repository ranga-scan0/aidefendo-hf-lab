# saas-external namespace — Pastebin mock (C2 staging store)
#
# Dual role:
#   - Agent stages scripts here via Artifactory ALPHA relay (PUT /paste/{n})
#   - CyberGym constructor reads scripts directly (GET /paste/{n})
#   - CyberGym writes results here directly (PUT /paste/result-{n})
#   - Agent polls results via relay (GET through Artifactory /github-remote)
#
# NetworkPolicy:
#   Ingress: from shared-registry (relay PUT/GET) + from modal-victim (constructor direct)
#   Egress:  none required (passive store)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pastebin
  namespace: saas-external
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pastebin
  template:
    metadata:
      labels:
        app: pastebin
    spec:
      containers:
        - name: pastebin
          # The mocks live at /opt/mocks/ in aidefendo-hf-mocks. The incident
          # image keeps its copy at /opt/orch/, so pointing here at the incident
          # image makes the command below fail with "No such file or directory"
          # — which is exactly what crash-looped this Deployment.
          # Every working deploy has used aidefendo-hf-mocks — keep it.
          image: aidefendo-hf-mocks:latest
          imagePullPolicy: Never
          command: ["python3", "/opt/mocks/pastebin_mock.py"]
          ports:
            - containerPort: 8200
          env:
            - name: PORT
              value: "8200"
          readinessProbe:
            httpGet:
              path: /status
              port: 8200
            initialDelaySeconds: 2
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /status
              port: 8200
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pastebin
  namespace: saas-external
spec:
  selector:
    app: pastebin
  ports:
    - port: 8200
      targetPort: 8200
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pastebin-policy
  namespace: saas-external
spec:
  podSelector:
    matchLabels:
      app: pastebin
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: shared-registry
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: modal-victim
  egress: []
