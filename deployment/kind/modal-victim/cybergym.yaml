# modal-victim namespace — CyberGym harness (compromised third-party sandbox)
#
# uid=0, no egress restriction — models a rooted sandbox with real network access.
# Constructor fetch-exec: receives .so via relay → dlopen() fires constructor →
# constructor curl-fetches script from artifactory/pastebin → executes it.
#
# NetworkPolicy:
#   Ingress: from shared-registry (Artifactory relay POST /upload-library)
#   Egress:  to saas-external (hub + pastebin — constructor scripts reach these directly)
#            to shared-registry (constructor fetches staged scripts from artifactory)
#            kube-dns only.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cybergym-harness
  namespace: modal-victim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cybergym-harness
  template:
    metadata:
      labels:
        app: cybergym-harness
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 0
      containers:
        - name: cybergym
          # Isolated image: only cybergym_mock.py on disk. Prevents RCE
          # from reading hub/worker mock source to discover exploit vectors.
          image: aidefendo-hf-cybergym:latest
          imagePullPolicy: Never
          command: ["python3", "/opt/mocks/cybergym_mock.py"]
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /status
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /status
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: cybergym-harness
  namespace: modal-victim
spec:
  selector:
    app: cybergym-harness
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cybergym-policy
  namespace: modal-victim
spec:
  podSelector:
    matchLabels:
      app: cybergym-harness
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: shared-registry
  egress:
    # kube-dns (resolves hub + pastebin FQDNs)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # constructor scripts reach hub + pastebin directly (no relay needed)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: saas-external
    # constructor fetches staged scripts (investigate.sh, probes) from artifactory
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: shared-registry
