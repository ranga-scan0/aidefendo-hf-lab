# kube-system namespace — over-privileged CSI driver SA (S3.4 TokenRequest theft target)
#
# Bound to cluster-admin, mirroring the real incident's CSI ClusterRole
# misconfiguration. No pod runs under this SA — it exists solely as the
# escalation target for S3.4: dataset-worker-sa has serviceaccounts/token
# create permission, and mints a token for this SA to obtain cluster-admin.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: csi-driver
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: csi-driver-cluster-admin
subjects:
  - kind: ServiceAccount
    name: csi-driver
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
