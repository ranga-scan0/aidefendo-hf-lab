# default namespace — credential bundle Secret (S3.3 bulk-read target)
#
# The named keys are the load-bearing loot for later stages:
#   jwt-signing-key   → S3.5 (EdDSA JWT forge — must verify against hub mock)
#   tailscale-auth-key → S4.1 (mesh enrollment)
#   github-app-private-key → S5.2 (token mint)
#   mongo-admin-password → embedded in MONGO_URL
#
# jwt-signing-key is a REAL Ed25519 private key — the matching public half is
# baked into the hub mock. S3.5 forges a signed JWT with it, and the hub mock
# verifies it with pyjwt.decode(..., algorithms=["EdDSA"]).
#
# Filler keys pad toward the incident's "136-key" bundle. S3.3 reads whatever
# exists.
---
apiVersion: v1
kind: Secret
metadata:
  name: cluster-credential-bundle
  namespace: default
type: Opaque
stringData:
  tailscale-auth-key: "tskey-auth-fakekeyFAKE0001"
  jwt-signing-key: |
    -----BEGIN PRIVATE KEY-----
    MC4CAQAwBQYDK2VwBCIEIEccv2K2MlwIYsTlcHsv651yEYym0+iHPHbpafXfl4/F
    -----END PRIVATE KEY-----
  mongo-admin-password: "staticpassword123"
  github-app-private-key: "-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA...\n-----END RSA PRIVATE KEY-----"
  filler-cred-001: "x0000000000000001"
  filler-cred-002: "x0000000000000002"
  filler-cred-003: "x0000000000000003"
  filler-cred-004: "x0000000000000004"
  filler-cred-005: "x0000000000000005"
  filler-cred-006: "x0000000000000006"
  filler-cred-007: "x0000000000000007"
  filler-cred-008: "x0000000000000008"
