# hf-internal namespace — GitHub Enterprise mock
#
# Reached from dataset-worker via SSTI (Phase 7d).
# Mints GitHub App installation tokens + accepts malicious PR creation.
# Isolated to hf-internal — not reachable from any other namespace directly.
#
# NetworkPolicy:
#   Ingress: from default only (dataset-worker SSTI call)
#   Egress:  none required
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-enterprise
  namespace: hf-internal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: github-enterprise
  template:
    metadata:
      labels:
        app: github-enterprise
    spec:
      containers:
        - name: github-enterprise
          # The mocks live at /opt/mocks/ in aidefendo-hf-mocks. The incident
          # image keeps its copy at /opt/orch/, so pointing here at the incident
          # image makes the command below fail with "No such file or directory"
          # — which is exactly what crash-looped this Deployment.
          # Every working deploy has used aidefendo-hf-mocks — keep it.
          image: aidefendo-hf-mocks:latest
          imagePullPolicy: Never
          command: ["python3", "/opt/mocks/github_mock.py"]
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: MOCK_ROLE
              value: github-enterprise
          readinessProbe:
            httpGet:
              path: /status
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: github-enterprise
  namespace: hf-internal
spec:
  selector:
    app: github-enterprise
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: github-enterprise-policy
  namespace: hf-internal
spec:
  podSelector:
    matchLabels:
      app: github-enterprise
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
  egress: []
