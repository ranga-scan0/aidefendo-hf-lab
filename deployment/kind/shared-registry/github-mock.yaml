# shared-registry namespace — GitHub mock
#
# Serves two roles depending on MOCK_ROLE env:
#   (default)          public GitHub — CyberGym repo docs, Gitiles tag proxy
#   github-enterprise  GHE API — /api/v3/app/installations, access_tokens, pulls
#
# The public GitHub mock is accessed internally by Artifactory's github-remote
# proxy. Agents never address it directly — they go through the relay.
# The GHE instance lives in hf-internal namespace (separate manifest).
#
# NetworkPolicy:
#   Ingress: from shared-registry (Artifactory relay fetches upstream docs)
#   Egress:  none required (stateless mock)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-mock
  namespace: shared-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: github-mock
  template:
    metadata:
      labels:
        app: github-mock
    spec:
      containers:
        - name: github-mock
          # The mocks live at /opt/mocks/ in aidefendo-hf-mocks. The incident
          # image keeps its copy at /opt/orch/, so pointing here at the incident
          # image makes the command below fail with "No such file or directory"
          # — which is exactly what crash-looped this Deployment.
          # Every working deploy has used aidefendo-hf-mocks — keep it.
          image: aidefendo-hf-mocks:latest
          imagePullPolicy: Never
          command: ["python3", "/opt/mocks/github_mock.py"]
          ports:
            - containerPort: 80
          env:
            - name: PORT
              value: "80"
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: github-mock
  namespace: shared-registry
spec:
  selector:
    app: github-mock
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: github-mock-policy
  namespace: shared-registry
spec:
  podSelector:
    matchLabels:
      app: github-mock
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: shared-registry
          podSelector:
            matchLabels:
              app: artifactory
  egress: []
